site_name: Gerege Template Platform V3.0
site_description: Цахим үйлчилгээг бүтээх суурь — Gerege Template Platform V3.0 documentation
site_url: https://gerege-systems.github.io/public-gerege-template/
repo_url: https://github.com/gerege-systems/public-gerege-template
repo_name: gerege-systems/public-gerege-template
edit_uri: edit/main/docs-site/docs/
copyright: © 2026 Gerege Systems · Gerege Template Platform V3.0
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/logo.webp
  favicon: assets/logo.webp
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Харанхуй горим
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Гэрэл горим
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit

extra_css:
  - stylesheets/brand.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: mn
          default: true
          name: Монгол
          build: true
        - locale: en
          name: English
          build: true
          site_name: Gerege Template Platform V3.0
          nav_translations:
            # Хэсгийн нэрс
            Танилцуулга: Getting started
            Архитектур: Architecture
            Нэвтрэлт: Authentication
            Ажиллагаа: Operations
            # Хуудсууд
            Тойм: Overview
            Түргэн эхлэл: Quick start
            Ерөнхий бүтэц: Clean Architecture
            "AI pipeline": "AI pipeline"
            "eID + SSO": "eID + SSO"
            "Апп холбох (OIDC RP)": "App integration (OIDC RP)"
            "eID Service Proxy": "eID Service Proxy"
            "API Gateway": "API Gateway"
            "Аюулгүй байдал": "Security"
            Байршуулалт: Deployment
            "Тохиргоо (env)": "Configuration (env)"
        - locale: ru
          name: Русский
          build: true
          site_name: Gerege Template Platform V3.0
          nav_translations:
            # Хэсгийн нэрс
            Танилцуулга: Начало работы
            Архитектур: Архитектура
            Нэвтрэлт: Аутентификация
            Ажиллагаа: Эксплуатация
            # Хуудсууд
            Тойм: Обзор
            Түргэн эхлэл: Быстрый старт
            Ерөнхий бүтэц: Clean Architecture
            "AI pipeline": "AI-конвейер"
            "eID + SSO": "eID + SSO"
            "Апп холбох (OIDC RP)": "Подключение приложения (OIDC RP)"
            "eID Service Proxy": "Прокси сервисов eID"
            "API Gateway": "API-шлюз"
            "Аюулгүй байдал": "Безопасность"
            Байршуулалт: Развёртывание
            "Тохиргоо (env)": "Конфигурация (env)"
        - locale: zh
          name: 中文
          build: true
          site_name: Gerege Template Platform V3.0
          nav_translations:
            # Хэсгийн нэрс
            Танилцуулга: 入门
            Архитектур: 架构
            Нэвтрэлт: 身份认证
            Ажиллагаа: 运维
            # Хуудсууд
            Тойм: 概览
            Түргэн эхлэл: 快速开始
            Ерөнхий бүтэц: 整洁架构
            "AI pipeline": "AI 流水线"
            "eID + SSO": "eID + SSO"
            "Апп холбох (OIDC RP)": "应用接入 (OIDC RP)"
            "eID Service Proxy": "eID 服务代理"
            "API Gateway": "API 网关"
            "Аюулгүй байдал": "安全"
            Байршуулалт: 部署
            "Тохиргоо (env)": "配置 (env)"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  # material icon shortcodes (:material-*: / :fontawesome-*:) → inline SVG.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gerege-systems

nav:
  - Танилцуулга:
      - Тойм: index.md
      - Түргэн эхлэл: quick-start.md
  - Архитектур:
      - Ерөнхий бүтэц: architecture.md
      - AI pipeline: ai-pipeline.md
  - Нэвтрэлт:
      - eID + SSO: authentication.md
      - Апп холбох (OIDC RP): sso-integration.md
      - eID Service Proxy: eid-services.md
      - API Gateway: api-gateway.md
  - Аюулгүй байдал: security.md
  - Ажиллагаа:
      - Байршуулалт: deployment.md
      - Тохиргоо (env): configuration.md
