# gitleaks тохиргоо — default дүрмүүд дээр нэмэлт allowlist. Энд зөвхөн жинхэнэ
# нууц БИШ, тестийн жишээ (dummy) утгуудыг зөвшөөрнө.
#
# ⚠️ Зам (path)-аар зөвшөөрч байгаа нь санаатай. `.gitleaksignore` нь
# fingerprint-ийг commit SHA-д уядаг тул template-ээс удамшин ирсэн ЯГ ижил
# файл өөр SHA дээр дахин «алдагдал» болж илэрдэг — замын дүрэм үүнээс
# хамаарахгүй.
[extend]
useDefault = true

[[allowlists]]
description = "Логгер unit тестийн жишээ trace ID (\"trace-123-456\") — жинхэнэ API key биш"
paths = ['''backend/pkg/logger/logger_test\.go''']
