# xcodegen тодорхойлолт — `xcodegen generate`-ээр .xcodeproj үүсгээд Xcode-оор нээнэ.
# (repo-д binary .xcodeproj хадгалахгүй; энэ нэг эх сурвалж.)
name: TemplateApp
options:
  bundleIdPrefix: mn.gerege
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  TemplateApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.gerege.template
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gerege Template
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
