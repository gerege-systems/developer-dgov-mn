# xcodegen тодорхойлолт — `xcodegen generate`-ээр .xcodeproj үүсгээд Xcode-оор нээнэ.
# (repo-д binary .xcodeproj хадгалахгүй; энэ нэг эх сурвалж.)
name: TemplateApp
options:
  bundleIdPrefix: mn.gerege
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  TemplateApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # Нэвтрэлт нь зөвхөн Gerege SSO бөгөөд бүхэлдээ template BFF-ээр (WKWebView) явна:
    # native OIDC client, App2App deeplink, Universal Links БАЙХГҮЙ тул
    # associated-domains ч, custom URL scheme ч шаардлагагүй. Info.plist-ийг
    # xcodegen үүсгэнэ.
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Gerege Template Platform V3.0
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only апп — iPad multitasking-д бүх orientation шаардахгүйн тулд
        # full screen гэж зарлана (Xcode "All interface orientations..." warning-ыг арилгана).
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.gerege.temp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
