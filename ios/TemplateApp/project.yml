# xcodegen тодорхойлолт — `xcodegen generate`-ээр .xcodeproj үүсгээд Xcode-оор нээнэ.
# (repo-д binary .xcodeproj хадгалахгүй; энэ нэг эх сурвалж.)
name: TemplateApp
options:
  bundleIdPrefix: mn.gerege
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  TemplateApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    entitlements:
      path: Sources/TemplateApp.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:template.gerege.mn
    # Info.plist — xcodegen үүсгэнэ. App2App-д geregetemp:// scheme бүртгэж,
    # geregesmartid:// (Gerege eID апп)-ыг canOpenURL-д зөвшөөрнө.
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Gerege Template
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: mn.gerege.temp
            CFBundleURLSchemes: [geregetemp]
        LSApplicationQueriesSchemes: [geregesmartid]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.gerege.temp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
