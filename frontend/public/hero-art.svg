<!-- Gerege Template Platform V3.0 — landing hero-ийн дэвсгэр чимэглэл (.lp-hero__art).
     САНАА: «Гэрэгэ» бол Монголын эзэнт гүрний эрх мэдлийн пайз — нэг л баталгаа
     эзэнт гүрний бүх хаалгыг нээж, өртөөний сүлжээгээр саадгүй нэвтрүүлдэг байв.
     Тэр пайз энд цахим хэлбэрээ олсон: гадна нь алтан зах, Соёмбо, босоо
     бичээс; дотор нь схемийн зам, баталгаажсан тэмдэг. Эргэн тойрны зангилаа
     нь өнөөдрийн үйлчилгээний «хаалга» (eID · SSO · гарын үсэг), доор нь
     өртөөний зам үргэлжилнэ. Өнгө: lp-navy дэвсгэр + алт (итгэл) + кобальт.
     ЗОХИОМЖ: гол дүрс баруун талд (x≈1000) — зүүн тал hero-ийн текстэд чөлөөтэй;
     cover-ийн улмаас дээд/доод ~150px хайчлагдахыг тооцов. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Гэрэгэ — эзэнт гүрний эрх мэдлийн пайз нь өнөөдрийн цахим танилт болж, өртөөний сүлжээгээр дамжин бүх үйлчилгээний хаалгыг нээж байгаа дүрслэл">
  <defs>
    <!-- Атмосфер -->
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E4B24A" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#E4B24A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0064E1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0064E1" stop-opacity="0"/>
    </radialGradient>

    <!-- Гэрэгэний метал — navy дэвсгэрээс ТОД ялгарахын тулд бараан -->
    <linearGradient id="plate" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#132648"/>
      <stop offset="38%"  stop-color="#0a1631"/>
      <stop offset="100%" stop-color="#050c1d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F3D08A"/>
      <stop offset="38%"  stop-color="#E4B24A"/>
      <stop offset="70%"  stop-color="#A97C28"/>
      <stop offset="100%" stop-color="#E4B24A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#12203f"/>
      <stop offset="100%" stop-color="#0c1830"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a1531" stop-opacity="0.88"/>
      <stop offset="46%"  stop-color="#0a1531" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0a1531" stop-opacity="0.52"/>
    </linearGradient>

    <!-- Гэрэгэний биеийн хэлбэр: дээд тал нь шулуун, доод тал нь дугуй —
         эртний пайзын хэлбэр. clip болон дүрсэнд дахин ашиглана. -->
    <path id="plateBody" d="M902 276 Q 902 246 932 246 H 1068 Q 1098 246 1098 276 L 1116 578 A 116 116 0 0 1 884 578 Z"/>
    <!-- Safari-д clipPath доторх <use> тогтворгүй тул хэлбэрийг давхардуулав -->
    <clipPath id="plateClip">
      <path d="M902 276 Q 902 246 932 246 H 1068 Q 1098 246 1098 276 L 1116 578 A 116 116 0 0 1 884 578 Z"/>
    </clipPath>

    <filter id="soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ── Атмосферын гэрэлтэлт ─────────────────────────────────────────── -->
  <circle cx="1000" cy="400" r="380" fill="url(#glowGold)"/>
  <circle cx="330"  cy="250" r="420" fill="url(#glowBlue)"/>
  <circle cx="1230" cy="640" r="300" fill="url(#glowBlue)" opacity="0.7"/>

  <!-- Уул + өртөөний зам: hero cover-т хайчлагдахгүйн тулд дээш өргөв -->
  <g transform="translate(0 -76)">
    <!-- ── Монгол тал: уулын хяр ────────────────────────────────────────── -->
    <path d="M0 762 L220 664 L430 732 L650 624 L900 722 L1150 642 L1440 742 L1440 900 L0 900 Z" fill="url(#ridge)" opacity="0.9"/>
    <path d="M0 806 L280 724 L520 784 L780 694 L1040 784 L1300 714 L1440 774 L1440 900 L0 900 Z" fill="#0a1730"/>

    <!-- ── Өртөөний зам: гэрэгэ барьсан элч эзэнт гүрнийг хөндлөн туулна ──
         Тасархай алтан зам + өртөө (waypoint) цэгүүд = өнөөдрийн үйлчилгээний
         сүлжээ. -->
    <path d="M-40 828 C 240 780, 460 856, 700 812 S 1180 748, 1490 806"
          fill="none" stroke="#E4B24A" stroke-width="1.6" stroke-dasharray="3 12" opacity="0.45"/>
    <g fill="#E4B24A" opacity="0.75">
      <circle cx="232" cy="795" r="3.5"/>
      <circle cx="556" cy="836" r="3"/>
      <circle cx="700" cy="812" r="4"/>
      <circle cx="1010" cy="774" r="3"/>
      <circle cx="1316" cy="784" r="3.5"/>
    </g>
    <g fill="none" stroke="#E4B24A" stroke-width="1" opacity="0.3">
      <circle cx="700" cy="812" r="11"/>
      <circle cx="1316" cy="784" r="10"/>
    </g>
  </g>
  <rect x="0" y="810" width="1440" height="90" fill="#0a1730"/>

  <!-- ── Баталгаажуулалтын сүлжээ: гэрэгэнээс бүх хаалга руу ──────────── -->
  <g stroke="#5f93ef" stroke-width="1.3" opacity="0.5">
    <line x1="1000" y1="470" x2="1268" y2="286"/>
    <line x1="1000" y1="470" x2="1330" y2="470"/>
    <line x1="1000" y1="470" x2="1252" y2="654"/>
    <line x1="1000" y1="470" x2="742"  y2="300"/>
    <line x1="1000" y1="470" x2="672"  y2="470"/>
    <line x1="1000" y1="470" x2="748"  y2="646"/>
  </g>
  <g stroke="#5f93ef" stroke-width="1" opacity="0.24">
    <path d="M1268 286 L1330 470 L1252 654" fill="none"/>
    <path d="M742 300 L672 470 L748 646" fill="none"/>
  </g>

  <!-- Хаалга (үйлчилгээ бүр) — зургаан өнцөгт зангилаа, баталгаажсан нь алт -->
  <g>
    <g fill="#0d1c3a" stroke="#E4B24A" stroke-width="1.6">
      <path d="M1268 262 l21 12 v24 l-21 12 l-21 -12 v-24 z"/>
      <path d="M672 446 l21 12 v24 l-21 12 l-21 -12 v-24 z"/>
    </g>
    <g fill="#E4B24A" opacity="0.9">
      <circle cx="1268" cy="286" r="3.4"/>
      <circle cx="672"  cy="470" r="3.4"/>
    </g>
    <g fill="#0d1c3a" stroke="#5f93ef" stroke-width="1.5">
      <path d="M1330 446 l19 11 v22 l-19 11 l-19 -11 v-22 z"/>
      <path d="M1252 630 l19 11 v22 l-19 11 l-19 -11 v-22 z"/>
      <path d="M742 276 l19 11 v22 l-19 11 l-19 -11 v-22 z"/>
      <path d="M748 622 l19 11 v22 l-19 11 l-19 -11 v-22 z"/>
    </g>
    <g fill="#5f93ef" opacity="0.85">
      <circle cx="1330" cy="470" r="3"/>
      <circle cx="1252" cy="654" r="3"/>
      <circle cx="742"  cy="300" r="3"/>
      <circle cx="748"  cy="646" r="3"/>
    </g>
    <!-- Идэвхтэй баталгаажуулалтын цуурай -->
    <circle cx="1268" cy="286" r="17" fill="none" stroke="#E4B24A" stroke-width="1.1" opacity="0.45"/>
    <circle cx="672"  cy="470" r="17" fill="none" stroke="#E4B24A" stroke-width="1.1" opacity="0.45"/>
  </g>

  <!-- Итгэлийн хүрээ: гэрэгэг тойрсон хамгаалалтын тойрог -->
  <circle cx="1000" cy="470" r="286" fill="none" stroke="#E4B24A" stroke-width="1.4" stroke-dasharray="2 11" opacity="0.42"/>
  <circle cx="1000" cy="470" r="330" fill="none" stroke="#5f93ef" stroke-width="1"  stroke-dasharray="1 14" opacity="0.28"/>

  <!-- ══ ГЭРЭГЭ (пайз) — эрх мэдлийн бичээст пайз, цахим хэлбэрээр ══════ -->
  <g transform="rotate(-6 1000 470)">
    <!-- сүүдэр / гэрэлтэлт -->
    <ellipse cx="1000" cy="490" rx="150" ry="270" fill="#E4B24A" opacity="0.16" filter="url(#soft)"/>

    <!-- өлгөх нүхтэй толгой -->
    <path d="M1000 164 a42 42 0 0 1 42 42 a42 42 0 0 1 -42 42 a42 42 0 0 1 -42 -42 a42 42 0 0 1 42 -42 z"
          fill="url(#plate)" stroke="url(#rim)" stroke-width="4"/>
    <circle cx="1000" cy="206" r="14" fill="#050c1d" stroke="#E4B24A" stroke-width="2" opacity="0.95"/>
    <!-- ороосон судас (гэрэгэг хүзүүнд зүүдэг) -->
    <path d="M960 191 C 922 142, 1078 142, 1040 191" fill="none" stroke="#E4B24A" stroke-width="2.4" opacity="0.5"/>

    <!-- пайзын бие -->
    <use href="#plateBody" fill="url(#plate)"/>
    <use href="#plateBody" fill="url(#sheen)"/>
    <use href="#plateBody" fill="none" stroke="url(#rim)" stroke-width="5"/>

    <g clip-path="url(#plateClip)">
      <!-- дотоод хүрээ (сийлсэн зах) -->
      <path d="M918 288 Q 918 262 944 262 H 1056 Q 1082 262 1082 288 L 1098 578 A 98 98 0 0 1 902 578 Z"
            fill="none" stroke="#E4B24A" stroke-width="1.4" opacity="0.6"/>

      <!-- Цахим давхарга: пайзын гадаргуу дээрх схемийн зам, холбоос
           (эртний эрх мэдэл → чип) -->
      <g stroke="#5f93ef" stroke-width="1.1" opacity="0.5" fill="none">
        <path d="M904 320 h -16 v 92 h 22"/>
        <path d="M1096 348 h 18 v 124 h -22"/>
        <path d="M904 540 h -20 v 60 h 28"/>
        <path d="M1096 578 h 16 v 54"/>
      </g>
      <g fill="#5f93ef" opacity="0.6">
        <rect x="884" y="316" width="7" height="7" rx="1"/>
        <rect x="1110" y="344" width="7" height="7" rx="1"/>
        <rect x="880" y="536" width="7" height="7" rx="1"/>
        <rect x="1108" y="574" width="7" height="7" rx="1"/>
      </g>

      <!-- Соёмбо: гал · нар · сар · тэнцвэрийн хэвтээ баганууд -->
      <g transform="translate(1000 316)" fill="#E4B24A">
        <path d="M0 -44 C 11 -25, 11 -11, 0 4 C -11 -11, -11 -25, 0 -44 Z"/>
        <path d="M-17 -29 C -11 -18, -11 -8, -17 2 C -23 -8, -23 -20, -17 -29 Z" opacity="0.9"/>
        <path d="M17 -29 C 23 -20, 23 -8, 17 2 C 11 -8, 11 -18, 17 -29 Z" opacity="0.9"/>
        <circle cx="0" cy="19" r="8"/>
        <g transform="translate(0 34) rotate(-90)">
          <path d="M 0 -17 A 17 17 0 1 0 0 17 A 13 20 0 1 1 0 -17 Z"/>
        </g>
        <rect x="-34" y="48" width="68" height="7" rx="2"/>
        <rect x="-34" y="64" width="68" height="7" rx="2" opacity="0.75"/>
      </g>

      <!-- Босоо монгол бичээс маягийн сийлбэр (чимэглэл) -->
      <g stroke="#F0CE8E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.82">
        <path d="M968 412 v 168"/>
        <path d="M968 424 c -12 3 -12 13 0 15"/>
        <path d="M968 452 c 12 3 12 13 0 15"/>
        <path d="M968 482 c -12 3 -12 13 0 15"/>
        <path d="M968 512 c 12 3 12 13 0 15"/>
        <path d="M968 544 c -12 3 -12 13 0 15"/>
        <path d="M968 572 c 10 6 6 17 -4 19"/>

        <path d="M1032 412 v 146"/>
        <path d="M1032 430 c 12 3 12 13 0 15"/>
        <path d="M1032 460 c -12 3 -12 13 0 15"/>
        <path d="M1032 490 c 12 3 12 13 0 15"/>
        <path d="M1032 522 c -12 3 -12 13 0 15"/>
        <path d="M1032 550 c 10 6 6 17 -4 19"/>
      </g>

      <!-- Хадаас (зэс товруу) -->
      <g fill="#E4B24A" opacity="0.75">
        <circle cx="912" cy="274" r="4"/>
        <circle cx="1088" cy="274" r="4"/>
      </g>

      <!-- Баталгаажсан тэмдэг: доод дугуй хэсэгт чек -->
      <g transform="translate(1000 630)">
        <circle r="26" fill="#0a1630" stroke="#E4B24A" stroke-width="2"/>
        <path d="M-11 1 l8 9 l15 -17" fill="none" stroke="#E4B24A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle r="36" fill="none" stroke="#E4B24A" stroke-width="1" opacity="0.38"/>
      </g>

      <!-- гэрлийн туяа -->
      <path d="M888 730 L992 240 L1034 240 L930 730 Z" fill="#ffffff" opacity="0.05"/>
    </g>
  </g>

  <!-- ── Дижитал бөөмс ────────────────────────────────────────────────── -->
  <g fill="#9ab8f5" opacity="0.65">
    <circle cx="230"  cy="360" r="3"/>
    <circle cx="410"  cy="470" r="2.5"/>
    <circle cx="360"  cy="180" r="2.5"/>
    <circle cx="1372" cy="352" r="3"/>
    <circle cx="1300" cy="196" r="2.5"/>
    <circle cx="560"  cy="360" r="2.5"/>
    <circle cx="612"  cy="200" r="2"/>
  </g>
  <g fill="#E4B24A" opacity="0.5">
    <circle cx="1398" cy="586" r="2.5"/>
    <circle cx="520"  cy="606" r="2.5"/>
  </g>

  <!-- ── Текстийн уншигдац хадгалах давхарга ──────────────────────────── -->
  <rect x="0" y="0" width="1440" height="900" fill="url(#vignette)"/>
</svg>
