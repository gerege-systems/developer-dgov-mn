# wallet.gerege.mn — nginx reverse proxy (standalone).
# docker compose нь портуудыг 127.0.0.1 дээр л bind хийдэг; nginx гадагшаа гаргана.
#   wallet.gerege.mn, api.wallet.gerege.mn -> wallet API   (127.0.0.1:8092)
#   admin.wallet.gerege.mn                 -> admin UI (BFF) (127.0.0.1:3010)
# TLS-ийг certbot --nginx автоматаар нэмж/шинэчилнэ.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- wallet API (партнерууд /oauth/token, /api/v1/wallet/*, /webhooks/bank/topup) ----
server {
    listen 80;
    listen [::]:80;
    server_name wallet.gerege.mn api.wallet.gerege.mn;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ---- super-admin UI (Next.js BFF) ----
server {
    listen 80;
    listen [::]:80;
    server_name admin.wallet.gerege.mn;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
