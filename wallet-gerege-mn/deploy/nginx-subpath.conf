# Wallet-ийг тусдаа DNS/субдомэйнгүйгээр, аль хэдийн TLS-тэй байгаа vhost-ийн
# (ж: tempv26.gerege.mn) server {} блок ДОТОР зам(path)-аар гаргах жишээ.
# docker compose нь портуудыг 127.0.0.1 дээр л bind хийдэг.
#
#   /wallet/       -> wallet API   (prefix-ийг хусаж дамжуулна: /wallet/oauth/token
#                                   -> /oauth/token, /wallet/api/v1/wallet -> ...)
#   /wallet-admin  -> admin UI     (Next.js basePath=/wallet-admin гэж build хийсэн
#                                   байх ёстой — compose-ийн ADMIN_BASE_PATH env)
#
# Анхаар: эдгээр location-ууд үндсэн `location /`-аас илүү тодорхой тул түрүүлж
# тааруулна; үндсэн апп-ын /api/* зэрэг замуудтай мөргөлдөхгүй.

    # ---- wallet API (партнерууд: oauth token, wallet CRUD, bank webhook) ----
    location /wallet/ {
        proxy_pass http://127.0.0.1:8094/;   # төгсгөлийн / нь /wallet/ prefix-ийг хусна
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }

    # ---- super-admin UI (Next.js BFF, basePath=/wallet-admin) ----
    location /wallet-admin {
        proxy_pass http://127.0.0.1:3012;    # prefix хусахгүй — Next өөрөө basePath дор үйлчилнэ
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
