# template.gerege.mn — edge nginx vhost.
#
# ⚠️ ЭНЭ ФАЙЛ БОЛ АМЬД ПРОД КОНФИГ (лавлах хувилбар БИШ).
#
# Эзэмшигч: энэ репо. `deploy/edge/install.sh` нь үүнийг edge nginx-ийн conf.d
# хавтас руу `template.gerege.mn.conf` нэрээр суулгаж, `nginx -t` шалгаад
# reload хийдэг. Тухайн хавтасны замыг скрипт өөрөө edge контейнерийн
# mount-аас олдог — энэ репо-д хостын зам хатуу бичигдээгүй.
#
# Тэр conf.d хавтас нь өөр репо-гийн ажлын хуулбар дотор байрлаж болно. Энэ
# файл тэнд БҮРТГЭЛГҮЙ (untracked) байдаг тул тэдний `git reset --hard` дарж
# бичихгүй; deploy бүр дахин суулгадаг тул алдагдсан ч өөрөө сэргэнэ.
# Дэлгэрэнгүй: deploy/edge/README.md
#
# Upstream: `template-gerege-web` контейнер. Тэр нэр нь хостын untracked
# `docker-compose.override.yml`-аас ирдэг — web-ийг хуваалцсан edge сүлжээнд
# холбож `container_name` өгдөг. Override алга бол vhost 502 өгнө.

# Өөрийн rate-limit zone-ууд. Edge дээрх нийтлэг zone файл руу хандвал түүнээс
# хамааралтай болно — тиймээс өөрийнхөө zone-ыг зарлана.
# Нэвтрэлт 5r/s (brute-force хамгаалалт), апп 50r/s.
limit_req_zone $binary_remote_addr zone=tpl_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=tpl_app:10m  rate=50r/s;

# HTTP → HTTPS + ACME challenge.
# Энэ блок нь template.gerege.mn-ийг ЯГ ТААРУУЛЖ авдаг тул port 80-ийн ерөнхий
# default server-ээс хамаарахгүй — гэрчилгээний шинэчлэлт өөрөө ажиллана.
server {
    listen 80;
    server_name template.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS vhost → template-gerege-web (Next.js BFF).
server {
    listen 443 ssl;
    http2 on;
    server_name template.gerege.mn;

    ssl_certificate     /etc/letsencrypt/live/template.gerege.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/template.gerege.mn/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 4m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Хатуу auth хязгаарыг ЗӨВХӨН нэвтрэлтийн замуудад. Бүх `/`-д тавихад
    # dashboard-ийн RSC prefetch-ууд (нэг хуудсанд олон арван хүсэлт) хязгаар
    # давж 503 өгдөг.
    location /login    { limit_req zone=tpl_auth burst=20 nodelay; proxy_pass http://template-gerege-web:3000; }
    location /oauth    { limit_req zone=tpl_auth burst=20 nodelay; proxy_pass http://template-gerege-web:3000; }
    location /auth     { limit_req zone=tpl_auth burst=20 nodelay; proxy_pass http://template-gerege-web:3000; }
    location /api/auth { limit_req zone=tpl_auth burst=20 nodelay; proxy_pass http://template-gerege-web:3000; }

    location / {
        limit_req zone=tpl_app burst=200 nodelay;
        proxy_pass http://template-gerege-web:3000;
    }
}
