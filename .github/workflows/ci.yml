# Gerege Template — CI/CD pipeline
#
# Backend (Go): go vet + gofmt + go test -race + integration compile + build.
# Frontend (Next.js): lint + build. Secrets scan (gitleaks binary, no license).
# makefile-ийн `pre-push` target-уудтай ойролцоо.
#
# Тэмдэглэл: golangci-lint-action-ийг түр хассан — latest golangci-lint нь Go 1.24-ээр
# build хийгдсэн бөгөөд go.mod-ийн target Go 1.26-г "lower than targeted" гэж татгалздаг.
# golangci-lint Go 1.26-г дэмжсэн үед буцааж нэмнэ. Одоохондоо go vet + gofmt-ээр линт.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (vet · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt-аар форматлагдаагүй файлууд:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Integration test compile check (no Docker)
        run: go vet -tags integration ./...

      - name: Build binaries
        run: |
          go build ./cmd/api
          go build ./cmd/migration
          go build ./cmd/seed
          go build ./cmd/healthcheck

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  wallet:
    name: Wallet (vet · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet-gerege-mn
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: wallet-gerege-mn/go.sum

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt-аар форматлагдаагүй файлууд:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests (race)
        run: go test -race ./...

      - name: Build binaries
        run: |
          go build ./cmd/api
          go build ./cmd/admin
          go build ./cmd/worker
          go build ./cmd/migrate
          go build ./cmd/client

  wallet-admin:
    name: Wallet admin (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet-gerege-mn/admin
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # lockfile байхгүй тул npm install (Dockerfile-тай ижил semantics)
      - name: Install deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        # gitleaks-action@v2 нь org repo-д license шаарддаг тул binary-г шууд татаж
        # ажиллуулна (license-гүй).
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --verbose --exit-code 1
