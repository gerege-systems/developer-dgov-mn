# Gerege Template — CI/CD pipeline
#
# Backend (Go): go vet + gofmt + go test -race + integration compile + build,
# мөн тусдаа job-д жинхэнэ Postgres/Redis дээр integration тест.
# Frontend (Next.js): lint + build. Secrets scan (gitleaks binary, no license).
# makefile-ийн `pre-push` target-уудтай ойролцоо.
#
# Тэмдэглэл: golangci-lint-action-ийг түр хассан — latest golangci-lint нь Go 1.24-ээр
# build хийгдсэн бөгөөд go.mod-ийн target Go 1.26-г "lower than targeted" гэж татгалздаг.
# golangci-lint Go 1.26-г дэмжсэн үед буцааж нэмнэ. Одоохондоо go vet + gofmt-ээр линт.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (vet · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt-аар форматлагдаагүй файлууд:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build binaries
        run: |
          go build ./cmd/api
          # migrate/seed/healthcheck нь platform-core модульд байрлана —
          # энэ репод хуулбар байхгүй тул хамаарлаас шууд build хийнэ.
          go build github.com/gerege-systems/platform-core/cmd/migration
          go build github.com/gerege-systems/platform-core/cmd/seed
          go build github.com/gerege-systems/platform-core/cmd/healthcheck

  # Integration тестүүд жинхэнэ Postgres/Redis дээр (testcontainers, runner-ийн
  # Docker-ыг ашиглана). Compile check нь эдгээрийг ЗӨВХӨН build хийдэг тул
  # ажиллуулдаггүй байсан — үр дүнд нь role ID дахин зурагдахад эрхийн matrix
  # тест чимээгүй утгаа алдаж, «user» persona админ болж хувирсныг хэн ч
  # анзаараагүй. Тиймээс одоо бодитоор ажиллуулна.
  # Backend-ийн integration тестүүд platform-core repo-д шилжсэн (суурь код
  # тэнд байрлана). Энэ репо нь нимгэн апп тул өөрийн тесттэй болмогц энд
  # шинэ job нэмнэ.

  frontend:
    name: Frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        # gitleaks-action@v2 нь org repo-д license шаарддаг тул binary-г шууд татаж
        # ажиллуулна (license-гүй).
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --verbose --exit-code 1

  # CD: бүх шалгуур (backend · frontend · secrets) давсны дараа main-д push хийхэд
  # л ажиллана. VPS руу SSH-ээр орж тухайн commit-ийг татаж, docker compose stack-ийг
  # дахин build/restart хийгээд эрүүл болтол хүлээнэ (deploy/deploy.sh). Runbook:
  # docs/DEPLOYMENT.md. Шаардлагатай repo secrets: DEPLOY_HOST, DEPLOY_USER,
  # DEPLOY_SSH_KEY, DEPLOY_PATH (host дээрх checkout зам; хоосон бол
  # /srv/template-gerege-mn) — мөн заавал биш DEPLOY_PORT.
  deploy:
    name: Deploy (ssh · docker compose)
    needs: [backend, frontend, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploy-ууд давхцахаас сэргийлнэ; ажиллаж буйг таслахгүй (build дундуур зогсоохгүй).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH || '/srv/template-gerege-mn' }}"
            git fetch --prune origin
            git reset --hard ${{ github.sha }}
            bash deploy/deploy.sh
