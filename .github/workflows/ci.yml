# Government Template Platform V3.0
# CI хаалгууд — push (main) болон бүх PR дээр ажиллана. Backend (gofmt · vet ·
# golangci-lint · race test · swag drift · build · integration compile),
# frontend (lint · build · test), нууц түлхүүрийн скан (gitleaks). Локал дээр
# `make pre-push` (backend/) энэ багцыг тольдоно.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      # gofmt — `gofmt -l .` хоосон байх ёстой (CLAUDE.md CI gate).
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt-аар форматлагдаагүй файлууд байна. 'gofmt -w .' ажиллуулаад commit хийнэ үү:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint — Makefile ci-lint зөв хувилбарыг (v2) суулгана.
      - name: Lint
        run: make ci-lint

      - name: Unit tests (race + coverage)
        run: make ci-test

      # swag drift — handler annotation өөрчлөгдсөн бол docs/ дахин үүсгэж commit
      # хийсэн эсэхийг шалгана.
      - name: Swagger drift
        run: make ci-swag-check

      - name: Build API binary
        run: make ci-build

      # Integration тестүүдийн compile шалгалт (Docker шаардахгүй — vet зөвхөн
      # хөрвүүлж, ажиллуулахгүй).
      - name: Integration compile check
        run: go vet -tags=integration ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan repository history
        # gitleaks-action@v2 нь org repo-д license шаарддаг тул release binary-г
        # шууд татаж ажиллуулна. Go toolchain суулгаж эх кодоос build хийхээс
        # хурдан бөгөөд хувилбар нь тогтмолжсон (reproducible).
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --verbose --exit-code 1
