# Gerege Template Platform V3.0 — documentation site (MkDocs Material)
#
# docs-site/ өөрчлөгдөх бүрд GitHub Pages руу build + deploy хийнэ.
# Нийтлэгдэх хаяг: https://gerege-systems.github.io/public-gerege-template/
#
# PR дээр зөвхөн build (--strict) хийж шалгана — deploy хийхгүй. `--strict` нь
# эвдэрсэн дотоод линк, дутуу nav бичлэгийг алдаа болгон барьдаг.
name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install MkDocs + plugins
        run: pip install -r requirements.txt

      - name: Build
        run: mkdocs build --clean --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
