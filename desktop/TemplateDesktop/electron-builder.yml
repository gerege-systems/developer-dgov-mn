# Gerege Template Platform V3.0
# Gerege Systems Development Team болон Claude AI хамтран бүтээв, 2026.
#
# Багцлалтын тохиргоо. Одоогийн дэмжигдсэн target нь macOS —
# win/linux хэсэг нь дараагийн платформд бэлтгэсэн суурь (туршигдаагүй).

appId: mn.gerege.temp.desktop
productName: Gerege Template
copyright: © 2026 Gerege Systems

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - '!dist/**/*.test.js'
  - '!dist/**/*.test.js.map'
  - static/**/*
  - resources/**/*
  - package.json

mac:
  category: public.app-category.business
  icon: resources/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: '12.0'
  extendInfo:
    NSMicrophoneUsageDescription: >-
      AI туслах, дуут мессеж, амьд орчуулга ашиглахад микрофон шаардлагатай.
    NSCameraUsageDescription: >-
      Апп камер ашигладаггүй.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  title: ${productName} ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# --- Дараагийн платформууд (одоогоор туршигдаагүй) ---
win:
  target: [nsis]
  icon: resources/icon.icns

linux:
  target: [AppImage, deb]
  category: Office
  icon: resources/icon.icns
