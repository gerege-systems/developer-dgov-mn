<!doctype html>
<!--
  Gerege Template Platform V3.0
  Gerege Systems Development Team болон Claude AI хамтран бүтээв, 2026.

  Ачаалах серверийг сонгох дотоод цонх (Cmd+Shift+S). Web аппын хэсэг БИШ.
-->
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <title>Сервер солих</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <main>
      <h1>Сервер солих</h1>
      <p>Апп аль хаягийн web интерфейсийг ачаалахыг сонгоно уу.</p>

      <div class="presets" id="presets"></div>

      <label for="url">Өөр хаяг</label>
      <input id="url" type="url" placeholder="https://template.gerege.mn" spellcheck="false" />
      <p class="error" id="error"></p>

      <div class="actions">
        <button type="button" class="primary" id="save">Хадгалаад ачаалах</button>
        <button type="button" id="cancel">Болих</button>
      </div>

      <p class="note" id="note" hidden>
        Анхаар: <code>GEREGE_APP_URL</code> орчны хувьсагч тогтоогдсон тул апп
        дахин эхлэхэд түүнийг ашиглана.
      </p>
    </main>
    <script src="server.js"></script>
  </body>
</html>
